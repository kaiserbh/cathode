[package]
name = "cathode-core"
version = "0.2.0"
edition = "2021"
description = "Cathode core: pure, WASM-safe domain model, parsers, and catalog logic"
license = "GPL-3.0-or-later"
repository = "https://github.com/kaiserbh/cathode"

# Package is `cathode-core` (not `core`) so the crate name never shadows Rust's
# std `core` in dependent crates. The lib name derives to `cathode_core`.

# This crate must stay WASM-safe: no native-only dependencies (no rusqlite,
# no reqwest, no native-only tokio features). 
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# EPG: streaming XMLTV parser + timestamp parsing. `chrono` without `clock` keeps
# this crate WASM-safe — `now` is always supplied by the shell, never read here.
# Pinned to 0.37: 0.38 reworked text handling (XML entities now arrive as separate
# `Event::GeneralRef` events instead of being unescaped in `Event::Text`), which
# needs a deliberate parser migration. Bump once that migration lands.
quick-xml = "0.37"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
pollster = "0.4"
rstest = "0.26"
