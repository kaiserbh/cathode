name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (a new push to a PR supersedes the old).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# Make cargo resilient to transient crates.io / git network failures in CI
# (e.g. "[16] Error in the HTTP2 framing layer"). Retries cost nothing on success;
# the git CLI is more reliable than libgit2 for the dioxus-primitives git dep.
env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Formatting is toolchain-only, so it runs fastest on Linux with no native deps.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # rust-toolchain.toml pins the channel + rustfmt; rustup honours it on first use.
      - run: rustup show
      - run: cargo fmt --all -- --check

  # Enforce: `cathode-core` stays WASM-safe and the
  # Dioxus frontend still compiles to wasm32. No native deps, no LFS.
  wasm:
    name: WASM / frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # `dx` (Dioxus CLI) bundles the frontend; pin to the version used locally.
      # Built from source and cached, so later runs restore it instead of rebuilding.
      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7.9"
      - name: Verify dx is on PATH
        run: dx --version
      - name: core builds for wasm32 (WASM-safety invariant)
        run: cargo build -p cathode-core --target wasm32-unknown-unknown
      - name: frontend compiles to WASM
        run: dx build

  # Lint + test on every platform that has a working video surface
  # (macOS, Windows, Linux). The `wasm` job separately covers the portable core.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 ships libmpv.so.2 (mpv 0.37) for the `libmpv2` crate;
        # 22.04's libmpv.so.1 (mpv 0.34) would fail to link.
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          # Windows links the vendored libmpv import lib + ships its DLLs, both
          # stored in Git LFS. Without this the build fails at LNK1181 (mpv.lib).
          lfs: ${{ runner.os == 'Windows' }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # macOS resolves libmpv via Homebrew + pkg-config (see src-tauri/build.rs).
      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        run: |
          # GitHub's macOS runners preinstall third-party taps (aws/tap,
          # azure/bicep) we don't use; drop them so Homebrew doesn't warn about
          # untrusted taps. mpv comes from the trusted core tap.
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install mpv
      # Linux links the system libmpv and builds against GTK3 + WebKitGTK
      # (see src-tauri/src/playback/linux.rs).
      - name: Install mpv + GTK deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev \
            libmpv-dev libssl-dev pkg-config
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
