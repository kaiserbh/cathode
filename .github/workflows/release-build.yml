name: Release Build

# Fires when release-please publishes a Release (under the GitHub App identity).
# Builds the platform bundles and uploads them to that same Release.
on:
  release:
    types: [published]

permissions:
  contents: write

# Never cancel an in-flight publish.
concurrency:
  group: release-build-${{ github.event.release.tag_name }}
  cancel-in-progress: false

# Make cargo resilient to transient crates.io / git network failures in CI
# (e.g. "[16] Error in the HTTP2 framing layer"). Retries cost nothing on success;
# the git CLI is more reliable than libgit2 for the dioxus-primitives git dep.
env:
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64, target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin" }
          - { os: windows-latest, arch: x64, target: "", args: "" }
          # ubuntu-24.04 ships libmpv.so.2 (mpv 0.37), which the `libmpv2` crate
          # links against; 22.04's libmpv.so.1 (mpv 0.34) would fail to link.
          - { os: ubuntu-24.04, arch: x64, target: "", args: "" }
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact tagged commit the release points at.
          ref: ${{ github.event.release.tag_name }}
          # Windows needs the LFS-stored libmpv import lib + runtime DLLs.
          lfs: ${{ runner.os == 'Windows' }}

      - run: rustup show
      - name: Add Rust target (macOS)
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}-release

      - name: Install mpv + packaging tools (macOS)
        if: runner.os == 'macOS'
        run: |
          # GitHub's macOS runners preinstall third-party taps (aws/tap,
          # azure/bicep) we don't use; drop them so Homebrew doesn't warn about
          # untrusted taps. mpv comes from the trusted core tap.
          brew untap aws/tap azure/bicep 2>/dev/null || true
          # mpv provides the libmpv the app links against; dylibbundler copies its
          # dylib closure into the .app; create-dmg packages the fixed app. See
          # scripts/package-macos.sh.
          brew install mpv dylibbundler create-dmg

      # Linux links the system libmpv (libmpv-dev) and builds against GTK3 +
      # WebKitGTK; patchelf/librsvg are needed by the AppImage bundler.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf \
            libmpv-dev libssl-dev pkg-config

      # `dx` is invoked by tauri's beforeBuildCommand (`dx bundle --release`);
      # `tauri-cli` provides `cargo tauri` for the Rust-only project. Both are
      # built from source and cached, so later runs restore them.
      - name: Install Dioxus CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: dioxus-cli
          version: "0.7.9"
      - name: Install Tauri CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: tauri-cli
          version: "^2"

      # macOS is packaged by scripts/package-macos.sh (below), which bundles
      # libmpv's dylib closure into the .app so end users don't need `brew install
      # mpv`. tauri-action handles Windows and Linux.
      - uses: tauri-apps/tauri-action@v1
        if: runner.os != 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the AppImage without FUSE on the runner (appimagetool runs by
          # self-extracting instead of mounting). Harmless on Windows.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # Upload bundles to the existing Release rather than creating a new one.
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

      - name: Package + upload macOS bundle (libmpv bundled)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build the .app, copy libmpv's dylib closure into it, ad-hoc re-sign,
          # and package a .dmg; then upload it to the same Release tauri-action
          # publishes the other platforms to.
          bash scripts/package-macos.sh ${{ matrix.args }}
          dmg=$(find target src-tauri/target -type f -path '*bundle/dmg/Cathode_*.dmg' 2>/dev/null | head -n1)
          [ -n "$dmg" ] || { echo "::error::package-macos.sh produced no .dmg"; exit 1; }
          echo "Uploading $dmg"
          gh release upload "${{ github.event.release.tag_name }}" "$dmg" --clobber
