name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Don't cancel an in-flight release-PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Run release-please under a GitHub App identity (not GITHUB_TOKEN) so the
      # Release it publishes can trigger the downstream `release-build.yml`
      # workflow. Releases created by GITHUB_TOKEN do NOT trigger other workflows.
      # Requires repo secrets APP_ID and APP_PRIVATE_KEY (see README "Releasing").
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
