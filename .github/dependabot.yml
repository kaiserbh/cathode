version: 2
updates:
  # Cargo workspace (root + src-tauri + crates/core). The `dioxus-primitives`
  # git-rev dependency is intentionally pinned and won't be touched here.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
