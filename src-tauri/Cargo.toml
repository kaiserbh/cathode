[package]
name = "cathode"
version = "0.5.4"
description = "Cathode: a cross-platform IPTV player (Tauri shell)"
authors = ["KaiserBh"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/kaiserbh/cathode"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cathode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cathode-core = { path = "../crates/core" }
reqwest = "0.13"
# Local catalog cache (sources + categories/streams). Bundled so we compile
# SQLite from source and don't depend on a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# `spawn_blocking` for the synchronous catalog calls; runs on Tauri's runtime.
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
# Uses the default features (fmt + registry) plus the always-available `reload` module
# to flip the capture layer's target filter at runtime (Off disables it).
tracing-subscriber = "0.3"
# Local wall-clock timestamps for captured log lines (core's chrono is clock-less).
chrono = "0.4"
# Embedded playback: link libmpv directly and drive it via the render API.
libmpv2 = { version = "6", features = ["render"] }
raw-window-handle = "0.6"
tauri-plugin-dialog = "2.7.1"
flate2 = "1.1.9"

# macOS: own a native OpenGL view inside the Tauri window for the mpv surface.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSView",
    "NSWindow",
    "NSOpenGL",
    "NSOpenGLView",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
# Push the GL render onto the main thread from mpv's update callback.
dispatch2 = "0.3"
# dlsym(RTLD_DEFAULT, ...) for the mpv render get_proc_address resolver.
libc = "0.2"

# Windows: own a child window behind the transparent WebView2 and drive mpv's GL
# render API through an ANGLE (EGL -> D3D11) context. `windows` is pinned to the
# version wry/tao already pull in so it isn't compiled twice.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
] }
# Drive ANGLE's libEGL.dll at runtime without import libraries (the `dynamic`
# feature pulls in libloading internally).
khronos-egl = { version = "6", features = ["dynamic"] }

# Linux: own a GtkGLArea behind the WebKitGTK webview for the mpv surface. Tauri
# is GTK3 + WebKitGTK here; `gtk`/`glib` are pinned to the versions tauri already
# pulls so the reparented widgets share one type. One path covers Wayland (EGL)
# and X11 (GLX) because GtkGLArea selects the GL backend itself.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
# Wake the GTK main loop (queue_render) from mpv's update callback, which fires on
# an arbitrary thread. `MainContext::channel` is deprecated in glib 0.18, so we use
# an async channel driven by `glib::spawn_future_local`.
async-channel = "2"
# dlopen libepoxy.so.0 (GTK's GL loader) to resolve GL symbols for the mpv render
# get_proc_address resolver and the framebuffer query.
libloading = "0.8"
# setlocale(LC_NUMERIC, "C") before mpv_create — GTK sets the user locale during
# init, which makes libmpv's mpv_create() return NULL.
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
