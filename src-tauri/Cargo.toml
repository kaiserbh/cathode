[package]
name = "cathode"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cathode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cathode-core = { path = "../crates/core" }
reqwest = "0.12"
# Local catalog cache (sources + categories/streams). Bundled so we compile
# SQLite from source and don't depend on a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# `spawn_blocking` for the synchronous catalog calls; runs on Tauri's runtime.
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Embedded playback: link libmpv directly and drive it via the render API.
libmpv2 = { version = "6", features = ["render"] }
raw-window-handle = "0.6"

# macOS: own a native OpenGL view inside the Tauri window for the mpv surface.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSView",
    "NSWindow",
    "NSOpenGL",
    "NSOpenGLView",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
# Push the GL render onto the main thread from mpv's update callback.
dispatch2 = "0.3"
# dlsym(RTLD_DEFAULT, ...) for the mpv render get_proc_address resolver.
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
