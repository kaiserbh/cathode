[package]
name = "cathode-ui"
version = "0.1.0"
edition = "2024"
description = "Cathode frontend: the Dioxus (Rust/WASM) UI for the Cathode IPTV player"
license = "GPL-3.0-or-later"
repository = "https://github.com/kaiserbh/cathode"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-logger = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.4", features = ["futures"] }
cathode-core = { path = "crates/core" }
# Pinned to a rev: there is no usable crates.io release, so the git dep is pinned for
# reproducible builds. Bump deliberately when pulling new components.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27", version = "0.0.1", default-features = false }
dioxus-icons = { version = "0.1.0", default-features = false }

[workspace]
members = ["src-tauri", "crates/core"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
